<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チーム名簿マネージャー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --surface-2:#EEF2F6;
    --border:#DCE3EB;
    --text:#1B222C;
    --text-muted:#5B6472;
    --accent:#EA6A2E;
    --accent-ink:#FFFFFF;
    --accent-soft:#FCE3D2;
    --structure:#1F3A5B;
    --structure-ink:#F3F7FB;
    --good:#2E8B57;
    --good-soft:#DCEEE3;
    --danger:#C43B3B;
    --danger-soft:#F6DEDE;
    --focus:#3E7CB8;
    --gender-male:#2E6DA4;
    --gender-male-ink:#FFFFFF;
    --gender-female:#C94A80;
    --gender-female-ink:#FFFFFF;
    --shadow: 0 1px 2px rgba(20,30,45,.06), 0 8px 24px rgba(20,30,45,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11151C;
      --surface:#1A2028;
      --surface-2:#212936;
      --border:#2B3341;
      --text:#E8ECF2;
      --text-muted:#97A2B4;
      --accent:#FF8A4C;
      --accent-ink:#241205;
      --accent-soft:#3A2415;
      --structure:#0D2340;
      --structure-ink:#EAF1F8;
      --good:#4FBE84;
      --good-soft:#173026;
      --danger:#E2695F;
      --danger-soft:#3A1E1C;
      --focus:#6AA9E0;
      --gender-male:#5B9BD9;
      --gender-male-ink:#0B1E2E;
      --gender-female:#FF9AC1;
      --gender-female-ink:#3A0A1C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11151C;
    --surface:#1A2028;
    --surface-2:#212936;
    --border:#2B3341;
    --text:#E8ECF2;
    --text-muted:#97A2B4;
    --accent:#FF8A4C;
    --accent-ink:#241205;
    --accent-soft:#3A2415;
    --structure:#0D2340;
    --structure-ink:#EAF1F8;
    --good:#4FBE84;
    --good-soft:#173026;
    --danger:#E2695F;
    --danger-soft:#3A1E1C;
    --focus:#6AA9E0;
    --gender-male:#5B9BD9;
    --gender-male-ink:#0B1E2E;
    --gender-female:#FF9AC1;
    --gender-female-ink:#3A0A1C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans JP","Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; text-wrap:balance; }
  button{ font-family:inherit; }
  input,select{ font-family:inherit; font-size:15px; }
  .num{ font-variant-numeric:tabular-nums; }

  #shell{ max-width:1080px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  header.app-header{
    background:var(--structure);
    color:var(--structure-ink);
    padding:16px 20px 14px;
  }
  header.app-header .title-row{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  header.app-header h1{ font-size:20px; font-weight:900; margin:0; letter-spacing:.02em; }
  header.app-header .tagline{ font-size:12px; color:rgba(243,247,251,.68); margin:2px 0 0; }
  .version-tag{
    appearance:none; border:1px solid rgba(243,247,251,.35); background:rgba(243,247,251,.08);
    color:rgba(243,247,251,.92); font-size:11.5px; font-weight:700; letter-spacing:.02em;
    padding:2px 9px; border-radius:999px; cursor:pointer; line-height:1.6;
  }
  .version-tag:hover{ background:rgba(243,247,251,.16); }
  .changelog-entry{ padding:12px 0; border-bottom:1px solid var(--border); }
  .changelog-entry:last-child{ border-bottom:none; padding-bottom:0; }
  .changelog-entry:first-child{ padding-top:0; }
  .changelog-entry-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .changelog-ver{ font-weight:900; font-size:14.5px; color:var(--text); }
  .changelog-date{ font-size:12px; color:var(--text-muted); }
  .changelog-entry ul{ margin:0; padding-left:20px; }
  .changelog-entry li{ font-size:13.5px; color:var(--text); margin:3px 0; line-height:1.5; }

  nav.tabs{
    display:flex;
    gap:4px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:0 12px;
    position:sticky;
    top:0;
    z-index:10;
    overflow-x:auto;
  }
  .tab-btn{
    appearance:none; border:none; background:transparent; cursor:pointer;
    padding:12px 14px 10px; font-size:14px; font-weight:700; color:var(--text-muted);
    border-bottom:3px solid transparent; white-space:nowrap;
  }
  .tab-btn.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .tab-btn:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }

  .status-bar{
    display:flex; align-items:center; gap:8px;
    padding:8px 20px; font-size:12.5px; color:var(--text-muted);
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--text-muted); flex:none; }
  .status-bar.saved .status-dot{ background:var(--good); }
  .status-bar.saving .status-dot{ background:var(--focus); animation:pulse 1s infinite ease-in-out; }
  .status-bar.pending .status-dot{ background:var(--accent); }
  .status-bar.readonly .status-dot,.status-bar.error .status-dot{ background:var(--danger); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  @media (prefers-reduced-motion: reduce){ .status-bar.saving .status-dot{ animation:none; } }

  main#app{ flex:1; padding:16px 16px 64px; }
  @media (min-width:640px){ main#app{ padding:24px 24px 72px; } }

  .section-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .section-head h2{ font-size:17px; font-weight:700; margin:0; }
  .section-sub{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }

  .btn{
    appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:9px; padding:9px 14px; font-size:13.5px; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.05); border-color:var(--accent); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-muted); padding:7px 8px; }
  .btn-ghost:hover{ color:var(--danger); border-color:transparent; }
  .btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:7px; }
  .btn-danger{ background:var(--danger); border-color:var(--danger); color:#fff; }

  .empty-state{
    border:1.5px dashed var(--border); border-radius:14px; padding:32px 20px; text-align:center;
    color:var(--text-muted); font-size:13.5px; background:var(--surface);
  }

  /* ---- Members tab ---- */
  .member-list{ display:flex; flex-direction:column; gap:8px; }
  .member-card{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px; box-shadow:var(--shadow);
  }
  .num-badge{
    flex:none; width:42px; height:42px; border-radius:9px; background:var(--structure); color:var(--structure-ink);
    display:flex; align-items:center; justify-content:center; font-family:"Zen Kaku Gothic New"; font-weight:900; font-size:16px;
  }
  .member-card .info{ flex:1; min-width:0; }
  .member-card .name-row{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
  .member-card .name{ font-weight:700; font-size:14.5px; }
  .member-card .nick{ font-size:12.5px; color:var(--text-muted); }
  .member-card .meta{ font-size:11.5px; color:var(--text-muted); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; }
  .member-card .actions{ display:flex; gap:2px; flex:none; }
  .confirm-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; background:var(--danger-soft); border-radius:9px; padding:6px 10px; }

  /* ---- Tournament tab ---- */
  .tourn-layout{ display:flex; flex-direction:column; gap:18px; }
  @media (min-width:760px){ .tourn-layout{ flex-direction:row; align-items:flex-start; } }
  .tourn-list-col{ flex:0 0 260px; display:flex; flex-direction:column; gap:8px; }
  .tourn-detail-col{ flex:1; min-width:0; display:flex; flex-direction:column; gap:18px; }
  .tourn-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px; cursor:pointer;
    box-shadow:var(--shadow);
  }
  .tourn-card.active{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .tourn-card .t-name{ font-weight:700; font-size:14px; }
  .tourn-card .t-date{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .tourn-card .t-count{ font-size:11.5px; color:var(--accent); margin-top:4px; font-weight:700; }
  .tourn-card-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }

  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .pick-chip{
    display:flex; align-items:center; gap:7px; border:1.5px solid var(--border); background:var(--surface);
    border-radius:999px; padding:6px 12px 6px 8px; cursor:pointer; font-size:13px; font-weight:600;
  }
  .pick-chip .n{ background:var(--surface-2); border-radius:999px; min-width:22px; height:22px; padding:0 4px; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; }
  .pick-chip.selected{ border-color:var(--good); background:var(--good-soft); }
  .pick-chip.selected .n{ background:var(--good); color:#fff; }

  table.roster-table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  table.roster-table th,table.roster-table td{ text-align:left; padding:8px 10px; font-size:13px; border-bottom:1px solid var(--border); }
  table.roster-table th{ background:var(--surface-2); color:var(--text-muted); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; }
  table.roster-table tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; border-radius:12px; }

  /* ---- Serve tab ---- */
  .set-pills{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .set-pill{
    border:1.5px solid var(--border); background:var(--surface); border-radius:999px; padding:6px 14px;
    font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-muted);
  }
  .set-pill.active{ background:var(--structure); color:var(--structure-ink); border-color:var(--structure); }

  .serve-layout{ display:flex; flex-direction:column; gap:18px; margin-top:16px; }
  @media (min-width:760px){ .serve-layout{ flex-direction:row; } }
  .court-col{ flex:1.1; min-width:0; }
  .bench-col{ flex:0.8; min-width:0; }

  .slot-list{ display:flex; flex-direction:column; gap:6px; }
  .slot{
    display:flex; align-items:center; gap:10px; min-height:52px; border-radius:11px; padding:6px 8px 6px 6px;
    border:1.5px dashed var(--border); background:var(--surface-2);
  }
  .slot.drag-over{ border-color:var(--accent); background:var(--accent-soft); }
  .slot .order-num{
    flex:none; width:30px; height:30px; border-radius:8px; background:var(--structure); color:var(--structure-ink);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; font-family:"Zen Kaku Gothic New";
  }
  .slot.bench .order-num{ background:var(--text-muted); }
  .slot-placeholder{ flex:1; font-size:12px; color:var(--text-muted); padding:6px 4px; cursor:pointer; }
  .slot.armable{ border-color:var(--focus); }

  .chip{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--border);
    border-radius:9px; padding:6px 8px; cursor:grab; flex:1; min-width:0;
  }
  .chip.armed{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .chip.dragging{ opacity:.4; }
  .chip .cn{ flex:none; width:26px; height:26px; border-radius:7px; background:var(--structure); color:var(--structure-ink); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; }
  .chip .cname{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip .rm{ flex:none; margin-left:auto; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:15px; line-height:1; padding:2px 4px; }
  .chip .rm:hover{ color:var(--danger); }

  .pool-zone{
    border:1.5px dashed var(--border); border-radius:12px; padding:10px; margin-top:8px; min-height:60px;
    display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start;
  }
  .pool-zone.drag-over{ border-color:var(--accent); background:var(--accent-soft); }
  .pool-zone .chip{ flex:0 0 auto; }
  .col-label{ font-size:12.5px; font-weight:700; color:var(--text-muted); margin:0 0 8px; display:flex; align-items:center; justify-content:space-between; }
  .hint{ font-size:11.5px; color:var(--text-muted); margin-top:8px; }

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,20,28,.5); display:flex; align-items:flex-end; justify-content:center;
    z-index:100; padding:0;
  }
  @media (min-width:640px){ .modal-overlay{ align-items:center; padding:20px; } }
  .modal-card{
    background:var(--surface); width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:20px 20px 24px;
    max-height:90vh; overflow-y:auto; box-shadow:var(--shadow);
  }
  @media (min-width:640px){ .modal-card{ border-radius:16px; } }
  .modal-card h3{ margin:0 0 14px; font-size:16px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:4px; }
  .field input,.field select{
    width:100%; padding:9px 10px; border:1.5px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text);
  }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .form-error{ color:var(--danger); font-size:12.5px; margin-bottom:10px; min-height:1em; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

  .badge-readonly{ background:var(--danger-soft); color:var(--danger); border-radius:999px; padding:2px 10px; font-size:11.5px; font-weight:700; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  /* ---- Serve tab: pool add-chips, mode badge, drag & drop ---- */
  .pool-chip{
    display:flex; align-items:center; gap:7px; border:1.5px solid var(--border); background:var(--surface);
    border-radius:999px; padding:6px 12px 6px 8px; cursor:pointer; font-size:13px; font-weight:600;
  }
  .pool-chip:hover{ border-color:var(--accent); }
  .pool-chip .n{ background:var(--surface-2); border-radius:999px; min-width:22px; height:22px; padding:0 4px; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; }
  .pool-chip:disabled{ opacity:.4; cursor:not-allowed; }

  .mode-badge{ font-size:11px; font-weight:700; border-radius:999px; padding:3px 10px; }
  .mode-badge.court-mode{ background:var(--accent-soft); color:var(--accent); }
  .mode-badge.bench-mode{ background:var(--good-soft); color:var(--good); }
  .mode-badge.full{ background:var(--danger-soft); color:var(--danger); }

  .bench-tag{
    flex:none; background:var(--good-soft); color:var(--good); font-size:10px; font-weight:800;
    border-radius:5px; padding:1px 5px; letter-spacing:.02em;
  }

  .chip[data-slot-chip]{ touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .drag-ghost{
    position:fixed; top:0; left:0; z-index:999; pointer-events:none; opacity:.95;
    box-shadow:0 10px 28px rgba(20,30,45,.28); transform:translate(-50%,-50%) rotate(-2deg);
  }
  body.dnd-active{ cursor:grabbing; user-select:none; }
  body.dnd-active *{ cursor:grabbing !important; }

  /* ---- gender-colored jersey-number badges (kept distinct from position/order badges) ---- */
  .num-badge[data-gender="male"], .cn[data-gender="male"], .pool-chip .n[data-gender="male"], .pick-chip .n[data-gender="male"]{
    background:var(--gender-male); color:var(--gender-male-ink);
  }
  .num-badge[data-gender="female"], .cn[data-gender="female"], .pool-chip .n[data-gender="female"], .pick-chip .n[data-gender="female"]{
    background:var(--gender-female); color:var(--gender-female-ink);
  }
  .pick-chip.selected .n[data-gender="male"],.pick-chip.selected .n[data-gender="female"]{
    background:var(--gender-male); color:var(--gender-male-ink);
  }
  .pick-chip.selected .n[data-gender="female"]{ background:var(--gender-female); color:var(--gender-female-ink); }

  .header-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn-header{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.28); color:var(--structure-ink);
    border-radius:8px; padding:6px 11px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .btn-header:hover{ background:rgba(255,255,255,.16); }
  .import-summary{ font-size:13px; line-height:1.7; margin:0 0 14px; }
  .import-summary b{ color:var(--accent); }
</style>
</head>
<body>
<div id="shell">
  <header class="app-header">
    <div class="title-row">
      <h1>チーム名簿マネージャー</h1>
      <button type="button" class="version-tag" id="version-tag" data-action="open-changelog">v1.4.0</button>
    </div>
    <p class="tagline">メンバー登録・大会参加者・サーブ順をまとめて管理</p>
    <div class="header-actions">
      <button type="button" class="btn-header" data-action="export-data">⬇ データを書き出し</button>
      <button type="button" class="btn-header" data-action="trigger-import">⬆ データを読み込み</button>
      <input type="file" id="import-file" accept="application/json,.json" class="visually-hidden">
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="画面切り替え">
    <button type="button" class="tab-btn active" data-action="switch-tab" data-tab="members">メンバー管理</button>
    <button type="button" class="tab-btn" data-action="switch-tab" data-tab="tournament">大会・参加者</button>
    <button type="button" class="tab-btn" data-action="switch-tab" data-tab="serve">サーブ順</button>
  </nav>

  <div class="status-bar" id="status-bar">
    <span class="status-dot"></span>
    <span id="status-text">読み込み中…</span>
  </div>

  <main id="app"></main>
  <div id="modal-root"></div>
</div>

<script type="application/json" id="initial-state">
{"members":[],"tournaments":[]}
</script>

<script>
(function(){
  "use strict";

  var LS_KEY = "roster_manager_state_v1";
  var GENDERS = ["男性","女性","その他","回答しない"];

  var APP_VERSION = "1.4.0";
  var CHANGELOG = [
    {
      version: "1.4.0",
      date: "2026-08-31",
      items: [
        "ヘッダーにバージョン表示を追加し、タップすると更新履歴を確認できるようにしました。"
      ]
    },
    {
      version: "1.3.0",
      date: "2026-08-31",
      items: [
        "サーブ順画面で「参加メンバー（未配置）」の表示をコート・控えの上に移動しました。",
        "セット名（「第1セット」など）を自由に変更できるようにしました。"
      ]
    },
    {
      version: "1.2.0",
      date: "2026-08-24",
      items: [
        "サーブ順のUIを刷新：参加メンバーをタップすると、コート1番手→控えの順に自動で登録されるようにしました。",
        "コート/控えの入力モードが分かるバッジ表示を追加しました。",
        "サーブ順の並び替えをドラッグ&ドロップ対応(プレイリスト形式の並び替え・控えとコート間の入れ替え)にしました。",
        "背番号バッジとサーブ順バッジの見分けがつきやすいよう、性別で色分け(女性はピンク系)しました。"
      ]
    },
    {

  /* ---------------- persistence ---------------- */

  async function loadInitialState(){
    try{
      var res = await fetch("data/state.json", { cache: "no-store" });
      if(res.ok){
        var data = await res.json();
        if(data && typeof data === "object") return normalizeState(data);
      }
    }catch(e){ /* fall through */ }
    try{
      var ls = localStorage.getItem(LS_KEY);
      if(ls) return normalizeState(JSON.parse(ls));
    }catch(e){}
    var embedded = document.getElementById("initial-state");
    if(embedded){
      try{ return normalizeState(JSON.parse(embedded.textContent)); }catch(e){}
    }
    return defaultState();
  }

  function normalizeState(data){
    var s = defaultState();
    if(Array.isArray(data.members)) s.members = data.members;
    if(Array.isArray(data.tournaments)){
      s.tournaments = data.tournaments.map(function(t){
        t.participantIds = Array.isArray(t.participantIds) ? t.participantIds : [];
        t.sets = Array.isArray(t.sets) ? t.sets : [];
        t.sets.forEach(function(st){
          st.order = normalizeSlots(st.order, 9);
          st.bench = normalizeSlots(st.bench, 6);
          st.label = (typeof st.label === "string") ? st.label : "";
        });
        return t;
      });
    }
    return s;
  }
  function normalizeSlots(arr, cap){
    if(!Array.isArray(arr)) return [];
    var compact = arr.filter(function(x){ return !!x; });
    if(compact.length > cap) compact = compact.slice(0, cap);
    return compact;
  }

  /* ---- serve-order model ----
   * set.order / set.bench are COMPACT arrays (no gaps): index 0..length-1 are
   * the filled positions (1番手.. / 控え1..), and index length..capacity-1 are
   * shown as empty placeholders. Reordering within a list = remove+insert
   * (like reordering a playlist); moving between the two lists = swap the
   * two occupants directly (or a plain move when the target side is an
   * empty placeholder). */
  function getArr(listType){
    var set = currentSet();
    if(!set) return null;
    return listType === "order" ? set.order : set.bench;
  }
  function capacityOf(listType){ return listType === "order" ? 9 : 6; }

  function addFromPool(memberId){
    if(!requireWriter()) return;
    var set = currentSet();
    if(!set) return;
    if(set.order.length < 9){ set.order.push(memberId); }
    else if(set.bench.length < 6){ set.bench.push(memberId); }
    else { return; }
    ui.armed = null;
    renderApp();
    scheduleSave();
  }

  function handleRemoveFromSlot(el){
    if(!requireWriter()) return;
    var listType = el.getAttribute("data-list-type");
    var index = +el.getAttribute("data-index");
    var arr = getArr(listType);
    if(!arr) return;
    arr.splice(index, 1);
    ui.armed = null;
    renderApp();
    scheduleSave();
  }

  function performTransfer(source, target){
    if(!source || !target) return;
    if(source.listType === target.listType && source.index === target.index && !target.isPlaceholder) return;
    var srcArr = getArr(source.listType);
    if(!srcArr) return;
    var srcId = srcArr[source.index];
    if(srcId === undefined) return;

    if(source.listType === target.listType){
      srcArr.splice(source.index, 1);
      // target.index is the FINAL index the dragged item should land at
      // (the standard "arrayMove" convention) -- no direction-based
      // adjustment needed, since splice() already accounts for the
      // shrink caused by removing the source item above.
      var insertIdx = target.isPlaceholder ? srcArr.length : target.index;
      if(insertIdx > srcArr.length) insertIdx = srcArr.length;
      if(insertIdx < 0) insertIdx = 0;
      srcArr.splice(insertIdx, 0, srcId);
      return;
    }

    var tgtArr = getArr(target.listType);
    if(!tgtArr) return;
    if(target.isPlaceholder){
      if(tgtArr.length >= capacityOf(target.listType)) return;
      srcArr.splice(source.index, 1);
      tgtArr.push(srcId);
      return;
    }
    var tgtId = tgtArr[target.index];
    if(tgtId === undefined){
      srcArr.splice(source.index, 1);
      tgtArr.push(srcId);
    } else {
      srcArr[source.index] = tgtId;
      tgtArr[target.index] = srcId;
    }
  }

  function handleSlotClick(slotEl){
    if(!requireWriter()) return;
    var listType = slotEl.getAttribute("data-list-type");
    var index = +slotEl.getAttribute("data-index");
    var isPlaceholder = slotEl.getAttribute("data-placeholder") === "true";
    if(isPlaceholder){
      if(!ui.armed) return;
      performTransfer(ui.armed, { listType: listType, index: index, isPlaceholder: true });
      ui.armed = null;
      renderApp();
      scheduleSave();
      return;
    }
    if(!ui.armed){
      ui.armed = { listType: listType, index: index };
      renderApp();
      return;
    }
    if(ui.armed.listType === listType && ui.armed.index === index){
      ui.armed = null;
      renderApp();
      return;
    }
    performTransfer(ui.armed, { listType: listType, index: index, isPlaceholder: false });
    ui.armed = null;
    renderApp();
    scheduleSave();
  }

  function chipHtml(listType, index, memberId){
    var m = memberById(memberId);
    if(!m) return "";
    var isArmed = ui.armed && ui.armed.listType === listType && ui.armed.index === index;
    var label = m.nickname ? m.nickname : m.name;
    var benchTag = listType === "bench" ? '<span class="bench-tag">控え</span>' : '';
    var html = '<div class="chip' + (isArmed?' armed':'') + '"' +
      (ui.isWriter ? ' data-slot-chip' : '') +
      ' data-list-type="' + listType + '" data-index="' + index + '" data-member-id="' + m.id + '" tabindex="0">';
    html += '<span class="cn num"' + genderAttr(m.gender) + '>' + escapeHtml(m.number||"-") + '</span>';
    html += benchTag;
    html += '<span class="cname">' + escapeHtml(label) + '</span>';
    if(ui.isWriter){
      html += '<button type="button" class="rm" data-action="remove-from-slot" data-list-type="' + listType + '" data-index="' + index + '" aria-label="外す" title="外す">×</button>';
    }
    html += '</div>';
    return html;
  }

  function slotHtml(listType, index, memberId){
    var occupied = !!memberId;
    var attrs = 'data-slot data-list-type="' + listType + '" data-index="' + index + '" data-placeholder="' + (!occupied) + '"';
    var html = '<div class="slot' + (listType==="bench"?' bench':'') + (ui.armed?' armable':'') + '" ' + attrs + '>';
    html += '<span class="order-num num">' + (index+1) + '</span>';
    if(occupied){
      html += chipHtml(listType, index, memberId);
    } else {
      html += '<div class="slot-placeholder">空き' + (ui.armed ? '（タップして配置）' : '') + '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderServeTab(){
    var t = currentTournament();
    var html = '<div class="section-head"><div><h2>サーブ順</h2><div class="section-sub">背番号・ニックネームでコート内の並び順と控えを管理します（9人制）。</div></div></div>';

    html += '<div class="field" style="max-width:360px;"><label for="serve-tournament-select">大会を選択</label>';
    html += '<select id="serve-tournament-select" data-action-change="select-tournament-serve">';
    html += '<option value="">選択してください</option>';
    appState.tournaments.forEach(function(tt){
      html += '<option value="' + tt.id + '"' + (tt.id===ui.currentTournamentId?' selected':'') + '>' + escapeHtml(tt.name) + (tt.date?(' ('+escapeHtml(tt.date)+')'):'') + '</option>';
    });
    html += '</select></div>';

    if(!t){
      html += '<div class="empty-state">上のプルダウンで大会を選択してください。参加者は「大会・参加者」タブで設定します。</div>';
      return html;
    }
    if(!t.participantIds.length){
      html += '<div class="empty-state">この大会にはまだ参加者がいません。先に「大会・参加者」タブで参加者を選択してください。</div>';
      return html;
    }

    syncCurrentSetId();
    var sets = t.sets || [];
    html += '<div class="set-pills" style="margin-top:16px;">';
    sets.forEach(function(s, i){
      html += '<button type="button" class="set-pill' + (s.id===ui.currentSetId?' active':'') + '" data-action="select-set" data-id="' + s.id + '">' + escapeHtml(setLabel(s, i)) + '</button>';
    });
    if(ui.isWriter){
      html += '<button type="button" class="btn btn-sm" data-action="add-set">+ セットを追加</button>';
    }
    html += '</div>';

    var set = currentSet();
    if(!set){
      html += '<div class="empty-state" style="margin-top:14px;">「+ セットを追加」でセットを作成してください。</div>';
      return html;
    }

    var setIdx = sets.findIndex(function(s){ return s.id === set.id; });
    if(ui.isWriter){
      html += '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;">';
      html += '<button type="button" class="btn btn-sm btn-ghost" data-action="edit-set-label" data-id="' + set.id + '">✎ 名称を変更</button>';
      if(setIdx > 0){
        var curEmpty = set.order.length === 0 && set.bench.length === 0;
        if(curEmpty){
          html += '<button type="button" class="btn btn-sm" data-action="copy-prev-set">前のセットをコピー</button>';
        }
      }
      if(ui.confirmDeleteSet === set.id){
        html += '<span class="confirm-row">このセットを削除しますか？' +
          '<button type="button" class="btn btn-sm btn-danger" data-action="delete-set" data-id="' + set.id + '">削除</button>' +
          '<button type="button" class="btn btn-sm" data-action="cancel-delete-set">戻る</button></span>';
      } else {
        html += '<button type="button" class="btn btn-sm btn-ghost" data-action="confirm-delete-set" data-id="' + set.id + '">このセットを削除</button>';
      }
      html += '</div>';
    }

    var assigned = {};
    set.order.forEach(function(id){ assigned[id] = true; });
    set.bench.forEach(function(id){ assigned[id] = true; });
    var pool = t.participantIds.filter(function(id){ return !assigned[id]; }).map(memberById).filter(Boolean);
    pool = sortedMembers(pool);

    var orderFull = set.order.length >= 9;
    var benchFull = set.bench.length >= 6;
    var modeBadge;
    if(orderFull && benchFull){
      modeBadge = '<span class="mode-badge full">満員（コート・控えとも定員です）</span>';
    } else if(orderFull){
      modeBadge = '<span class="mode-badge bench-mode">次はタップで控えに追加されます</span>';
    } else {
      modeBadge = '<span class="mode-badge court-mode">次はタップでコート ' + (set.order.length+1) + '番手に追加されます</span>';
    }

    html += '<div class="col-label" style="margin-top:18px;"><span>参加メンバー（未配置）' + (pool.length?(' ・ '+pool.length+'人'):'') + '</span>' + modeBadge + '</div>';
    html += '<div class="pool-zone">';
    if(!pool.length){
      html += '<span class="hint">全員配置されています</span>';
    } else {
      pool.forEach(function(m){
        var disabled = !ui.isWriter || (orderFull && benchFull);
        html += '<button type="button" class="pool-chip" data-action="add-from-pool" data-id="' + m.id + '"' + (disabled?' disabled':'') + '>' +
          '<span class="n num"' + genderAttr(m.gender) + '>' + escapeHtml(m.number||"-") + '</span>' + escapeHtml(m.name) + '</button>';
      });
    }
    html += '</div>';
    html += '<p class="hint">参加メンバーをタップすると、コート→控えの順に自動で追加されます。並び替えはチップをドラッグ、またはタップして選択してから移動先をタップします。' + (ui.isWriter?'':' (読み取り専用のため編集できません)') + '</p>';

    html += '<div class="serve-layout">';
    html += '<div class="court-col"><div class="col-label"><span>コート（1〜9番手）</span></div><div class="slot-list">';
    for(var i=0;i<9;i++){
      html += slotHtml("order", i, set.order[i] || null);
    }
    html += '</div></div>';

    html += '<div class="bench-col"><div class="col-label"><span>控え（6枠）</span></div><div class="slot-list">';
    for(var j=0;j<6;j++){
      html += slotHtml("bench", j, set.bench[j] || null);
    }
    html += '</div></div>';
    html += '</div>';

    return html;
  }

  /* ---------------- modals ---------------- */

  function closeModal(){
    ui.memberModal = null;
    ui.tournamentModal = null;
    ui.setLabelModal = null;
    ui.changelogModal = false;
    ui.pendingImport = null;
    renderModalRoot();
  }
  function renderModalRoot(){
    var root = document.getElementById("modal-root");
    if(ui.memberModal) root.innerHTML = renderMemberModal(ui.memberModal.id);
    else if(ui.tournamentModal) root.innerHTML = renderTournamentModal(ui.tournamentModal.id);
    else if(ui.setLabelModal) root.innerHTML = renderSetLabelModal(ui.setLabelModal.id);
    else if(ui.changelogModal) root.innerHTML = renderChangelogModal();
    else if(ui.pendingImport) root.innerHTML = renderImportModal();
    else root.innerHTML = "";
  }
  function openMemberModal(id){ ui.memberModal = { id: id }; renderModalRoot(); }
  function openTournamentModal(id){ ui.tournamentModal = { id: id }; renderModalRoot(); }
  function openSetLabelModal(id){ ui.setLabelModal = { id: id }; renderModalRoot(); }
  function openChangelogModal(){ ui.changelogModal = true; renderModalRoot(); }

    var title = m ? "メンバーを編集" : "メンバーを追加";
    var genderOpts = GENDERS.map(function(g){
      return '<option value="' + g + '"' + (m && m.gender===g ? ' selected' : '') + '>' + g + '</option>';
    }).join("");
    var html = '<div class="modal-overlay" data-action="close-modal-overlay">';
    html += '<div class="modal-card" role="dialog" aria-modal="true" aria-label="' + title + '">';
    html += '<h3>' + title + '</h3>';
    html += '<div class="form-error" id="form-error"></div>';
    html += '<div class="field-row">';
    html += '<div class="field"><label for="f-number">背番号 *</label><input id="f-number" value="' + escapeHtml(m?m.number:"") + '"></div>';
    html += '<div class="field"><label for="f-name">名前 *</label><input id="f-name" value="' + escapeHtml(m?m.name:"") + '"></div>';
    html += '</div>';
    html += '<div class="field"><label for="f-nickname">ニックネーム</label><input id="f-nickname" value="' + escapeHtml(m?m.nickname:"") + '"></div>';
    html += '<div class="field-row">';
    html += '<div class="field"><label for="f-birthdate">生年月日</label><input type="date" id="f-birthdate" value="' + escapeHtml(m?m.birthdate:"") + '"></div>';
    html += '<div class="field"><label for="f-gender">性別</label><select id="f-gender"><option value="">未選択</option>' + genderOpts + '</select></div>';
    html += '</div>';
    html += '<div class="field"><label for="f-region">住んでる地域</label><input id="f-region" value="' + escapeHtml(m?m.region:"") + '"></div>';
    html += '<div class="field"><label for="f-school">出身校</label><input id="f-school" value="' + escapeHtml(m?m.school:"") + '"></div>';
    html += '<div class="modal-actions">';
    html += '<button type="button" class="btn" data-action="close-modal">キャンセル</button>';
    html += '<button type="button" class="btn btn-primary" data-action="save-member" data-id="' + (id||"") + '">保存</button>';

  /* ---------------- event wiring ---------------- */

  function handleAction(action, el){
    switch(action){
      case "switch-tab":
        ui.activeTab = el.getAttribute("data-tab");
        renderApp();
        break;
      case "open-changelog":
        openChangelogModal();
        break;
      case "add-member":
        if(!requireWriter()) break;
        openMemberModal(null);
        break;
      case "edit-member":
        openMemberModal(el.getAttribute("data-id"));
        break;
      case "confirm-delete-member":
        if(!requireWriter()) break;
        ui.confirmDeleteMember = el.getAttribute("data-id");
        renderApp();
        break;
      case "cancel-delete-member":
        ui.confirmDeleteMember = null;
        renderApp();
        break;
      case "delete-member":
        if(!requireWriter()) break;
        deleteMember(el.getAttribute("data-id"));
        break;
      case "close-modal":
      case "close-modal-overlay":
        closeModal();
        break;
      case "save-member":
        if(!requireWriter()) break;
        saveMemberFromForm(el.getAttribute("data-id") || null);
        break;
      case "add-tournament":
        if(!requireWriter()) break;
        openTournamentModal(null);
        break;
      case "edit-tournament":
        openTournamentModal(el.getAttribute("data-id"));
        break;
      case "save-tournament":
        if(!requireWriter()) break;
        saveTournamentFromForm(el.getAttribute("data-id") || null);
        break;
      case "confirm-delete-tournament":
        if(!requireWriter()) break;
        ui.confirmDeleteTournament = el.getAttribute("data-id");
        renderApp();
        break;
      case "cancel-delete-tournament":
        ui.confirmDeleteTournament = null;
        renderApp();
        break;
      case "delete-tournament":
        if(!requireWriter()) break;
        deleteTournament(el.getAttribute("data-id"));
        break;
      case "select-tournament":
        ui.currentTournamentId = el.getAttribute("data-id");
        syncCurrentSetId();
        renderApp();
        break;
      case "toggle-participant":
        if(!requireWriter()) break;
        toggleParticipant(el.getAttribute("data-id"));
        break;
      case "add-set":
        if(!requireWriter()) break;
        addSet();
        break;
      case "edit-set-label":
        if(!requireWriter()) break;
        openSetLabelModal(el.getAttribute("data-id"));
        break;
      case "save-set-label":
        if(!requireWriter()) break;
        saveSetLabelFromForm(el.getAttribute("data-id"));
        break;
      case "select-set":
        ui.currentSetId = el.getAttribute("data-id");
        ui.armed = null;
        renderApp();
        break;
      case "confirm-delete-set":
        if(!requireWriter()) break;
        ui.confirmDeleteSet = el.getAttribute("data-id");
        renderApp();
        break;
      case "cancel-delete-set":
        ui.confirmDeleteSet = null;
        renderApp();
        break;
      case "delete-set":
        if(!requireWriter()) break;
        deleteSet(el.getAttribute("data-id"));
        break;
      case "copy-prev-set":

      case "add-from-pool":
        addFromPool(el.getAttribute("data-id"));

        handleRemoveFromSlot(el);
        break;
      case "export-data":
        exportData();
        break;
      case "trigger-import":
        triggerImport();
        break;
      case "confirm-import":
        confirmImport();
        break;
      case "cancel-import":
        cancelImport();

    }

  var suppressNextClick = false;
  var dragState = null;

  document.addEventListener("click", function(e){
    if(suppressNextClick){ suppressNextClick = false; return; }
    var el = e.target.closest("[data-action]");
    if(el){
      var action = el.getAttribute("data-action");
      // The overlay's "close on backdrop click" must only fire when the
      // backdrop itself was clicked, not when a click inside the modal
      // card (an input, a label, ...) bubbles up to it.
      if(action === "close-modal-overlay" && e.target !== el) return;
      handleAction(action, el);
      return;
    }
    // Tap-to-arm / tap-to-place fallback for the serve-order court & bench
    // slots (mirrors what dragging does, for touch-less / accessible use).
    var slotEl = e.target.closest("[data-slot]");
    if(slotEl) handleSlotClick(slotEl);
  });

  document.addEventListener("change", function(e){
    if(e.target && e.target.id === "serve-tournament-select"){
      ui.currentTournamentId = e.target.value || null;
      syncCurrentSetId();
      renderApp();
    }
    if(e.target && e.target.id === "import-file"){
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if(file) handleImportFile(file);
    }
  });

  /* ---- pointer-based drag & drop for the serve-order slots ----
   * Works uniformly for mouse and touch. A move within the SAME list
   * reorders (remove + insert, like a playlist); a move to the OTHER
   * list swaps with whatever occupies the drop target (or just moves,
   * if the target is an empty placeholder). A plain tap (no movement
   * past the threshold) falls through to handleSlotClick via the click
   * listener above, EXCEPT a click that immediately follows a real drag,
   * which is suppressed so the drop isn't also treated as a tap. */
  document.addEventListener("pointerdown", function(e){
    if(!ui.isWriter) return;
    if(e.pointerType === "mouse" && e.button !== 0) return;
    if(e.target.closest('[data-action="remove-from-slot"]')) return;
    var chip = e.target.closest(".chip[data-slot-chip]");
    if(!chip) return;
    dragState = {
      pointerId: e.pointerId,
      chipEl: chip,
      listType: chip.getAttribute("data-list-type"),
      index: +chip.getAttribute("data-index"),
      startX: e.clientX,
      startY: e.clientY,
      dragging: false,
      ghost: null,
      hoverEl: null
    };
  });

  document.addEventListener("pointermove", function(e){
    if(!dragState || e.pointerId !== dragState.pointerId) return;
    var dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
    if(!dragState.dragging){
      if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      dragState.dragging = true;
      dragState.chipEl.classList.add("dragging");
      var rect = dragState.chipEl.getBoundingClientRect();
      var ghost = dragState.chipEl.cloneNode(true);
      ghost.classList.add("drag-ghost");
      ghost.style.width = rect.width + "px";
      ghost.style.pointerEvents = "none";
      document.body.appendChild(ghost);
      dragState.ghost = ghost;
      document.body.classList.add("dnd-active");
    }
    if(dragState.ghost){
      dragState.ghost.style.left = e.clientX + "px";
      dragState.ghost.style.top = e.clientY + "px";
    }
    var under = document.elementFromPoint(e.clientX, e.clientY);
    var slotEl = under ? under.closest("[data-slot]") : null;
    if(dragState.hoverEl && dragState.hoverEl !== slotEl){
      dragState.hoverEl.classList.remove("drag-over");
    }
    if(slotEl) slotEl.classList.add("drag-over");
    dragState.hoverEl = slotEl;
    e.preventDefault();
  }, { passive: false });

  function endDrag(commit){
    if(!dragState) return;
    var wasDragging = dragState.dragging;
    if(wasDragging){
      if(dragState.ghost) dragState.ghost.remove();
      dragState.chipEl.classList.remove("dragging");
      document.body.classList.remove("dnd-active");
      if(dragState.hoverEl) dragState.hoverEl.classList.remove("drag-over");
      if(commit && dragState.hoverEl){
        var listType = dragState.hoverEl.getAttribute("data-list-type");
        var index = +dragState.hoverEl.getAttribute("data-index");
        var isPlaceholder = dragState.hoverEl.getAttribute("data-placeholder") === "true";
        performTransfer(
          { listType: dragState.listType, index: dragState.index },
          { listType: listType, index: index, isPlaceholder: isPlaceholder }
        );
        ui.armed = null;
        renderApp();
        scheduleSave();
      }
      suppressNextClick = true;
      // A synthetic click doesn't reliably follow a drag whose pointerup
      // landed on a different element than the pointerdown did (browsers
      // vary), so don't leave this flag permanently stuck if no click
      // ever arrives to consume it. If a click DOES follow, it fires
      // synchronously right after pointerup -- before this timeout runs
      // -- so it still sees the flag as true and consumes it normally.
      setTimeout(function(){ suppressNextClick = false; }, 0);
    }
    dragState = null;
  }
  document.addEventListener("pointerup", function(e){
    if(!dragState || e.pointerId !== dragState.pointerId) return;
    endDrag(true);
  });
  document.addEventListener("pointercancel", function(e){
    if(!dragState || e.pointerId !== dragState.pointerId) return;
    endDrag(false);
  });

  /* ---------------- boot ---------------- */

  async function boot(){
    var vtag = document.getElementById("version-tag");
    if(vtag) vtag.textContent = "v" + APP_VERSION;
    appState = await loadInitialState();
    renderApp();
    ui.saveStatus = "saved";
    updateStatusBar();
  }

  boot();
})();
